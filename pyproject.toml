authors = [
    { name = "Valatras", email = "arifcan091@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ecologits>=0.11.3",
    "huggingface-hub>=2.4.0",
    "ipykernel>=7.4.0",
    "jinja2>=3.1.6",
    "mistral-common>=1.13.1",
    "mistralai>=3.7.0",
    "openai-harmony>=0.0.8",
